
name: CI Python avec PostgreSQL

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer PostgreSQL
        run: bash db/setup.sh

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dependances
        working-directory: python-app
        run: pip install -r requirements.txt

      - name: Executer les tests
        working-directory: python-app
        run: pytest -v

  node:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer PostgreSQL
        run: bash db/setup.sh

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dependances
        working-directory: node-app
        run: npm ci

      - name: Executer les tests
        working-directory: node-app
        run: npm test

  java:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer PostgreSQL
        run: bash db/setup.sh

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Executer les tests
        working-directory: java-app
        run: mvn -B package

  php:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer PostgreSQL
        run: bash db/setup.sh

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql

      - name: Installer les dependances
        working-directory: php-app
        run: composer install --no-interaction

      - name: Executer les tests
        working-directory: php-app
        run: vendor/bin/phpunit tests

  build:
    runs-on: ubuntu-latest
    needs: [python, node, java, php]
    steps:
      - name: Build du projet
        run: echo "Tous les tests ont reussi. Build termine."

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploiement
        run: echo "Déploiement en cours"

      - name: Verification du secret
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: test -n "$TOKEN" && echo "Token présent"
